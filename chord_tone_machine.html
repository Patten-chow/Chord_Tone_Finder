<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chord Tone Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .button {
            width: 150px;
            height: 50px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            background: #3498db;
            color: white;
            border-radius: 5px;
            text-align: center;
        }
        .button.active {
            background: #e74c3c;
        }
        .chords-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .chord {
            width: 22%;
            padding: 10px;
            font-size: 18px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

    <h1>Chord Tone Finder</h1>
    <div class="buttons">

        function toggleNote(button, note) {
            if (selectedNotes.has(note)) {
                selectedNotes.delete(note); // Remove the note if already selected
                button.classList.remove("active");
            } else {
                selectedNotes.add(note); // Add the note if not selected
                button.classList.add("active");
            }

            updateChords();
        }

        function updateChords() {
            const chordListDiv = document.getElementById("chordList");
            chordListDiv.innerHTML = ""; 

            if (selectedNotes.size === 0) {
                chordListDiv.innerHTML = "<p>Select notes to find chords.</p>";
                return;
            }

            let selectedArray = Array.from(selectedNotes);

            let matchingChords = Object.keys(chordTones).filter(chord =>
                selectedArray.every(note => chordTones[chord].includes(note))
            );

            if (matchingChords.length > 0) {
                matchingChords.forEach(chord => {
                    let chordDiv = document.createElement("div");
                    chordDiv.classList.add("chord");
                    chordDiv.innerText = chord;
                    chordListDiv.appendChild(chordDiv);
                });
            } else {
                chordListDiv.innerHTML = "<p>No matching chords found.</p>";
            }
        }
    </script>
